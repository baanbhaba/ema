<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALCHEMI - 404 Page Not Found</title>
  <!-- Outfit Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --text-muted: #71717a;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Scanlines */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .container {
      max-width: 32rem;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .error-code {
      font-size: 7.5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--primary);
      position: relative;
      display: inline-block;
      text-shadow: 2px 0 var(--danger), -2px 0 #3b82f6;
      animation: glitch 3s infinite linear alternate-reverse;
    }

    .divider {
      width: 6rem;
      height: 4px;
      background: var(--primary);
      margin: 1.5rem auto 2.5rem;
      border-radius: 9999px;
      box-shadow: 0 0 12px var(--primary);
    }

    .error-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      text-align: left;
      margin-bottom: 2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-b: 1px solid var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
      color: var(--primary);
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.1em;
    }

    .card-body {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .card-body .error-message {
      color: var(--danger);
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .card-body .trace-line {
      margin-bottom: 0.25rem;
    }

    .card-body .trace-label {
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .actions {
        flex-direction: row;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: bold;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #000;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: #27272a;
      border-color: #3f3f46;
    }

    @keyframes glitch {
      0% {
        text-shadow: 2px 0 var(--danger), -2px 0 #3b82f6;
      }
      25% {
        text-shadow: -2px 0 var(--danger), 2px 0 #3b82f6;
      }
      50% {
        text-shadow: 3px 1px var(--danger), -3px -1px #3b82f6;
      }
      75% {
        text-shadow: -1px -1px var(--danger), 1px 1px #3b82f6;
      }
      100% {
        text-shadow: 2px -2px var(--danger), -2px 2px #3b82f6;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <div class="divider"></div>

    <div class="error-card">
      <div class="card-header">
        ⚠️ ALCHEMI - Target Route Panic
      </div>
      <div class="card-body">
        <div class="error-message">> ERROR: The requested static resource or pipeline route could not be resolved.</div>
        <div class="trace-line"><span class="trace-label">status:</span> 404 Not Found</div>
        <div class="trace-line"><span class="trace-label">module:</span> StaticAssetLoader</div>
        <div class="trace-line"><span class="trace-label">cause:</span> Endpoint or resource file does not exist.</div>
      </div>
    </div>

    <div class="actions">
      <a href="javascript:history.back()" class="btn btn-secondary">
        ← Go Back
      </a>
      <a href="/" class="btn btn-primary">
        Return to Dashboard
      </a>
    </div>
  </div>
</body>
</html>
